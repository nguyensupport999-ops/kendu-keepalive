# Đặt file này tại: .github/workflows/keepalive.yml trong một repo GitHub CÔNG KHAI riêng (xem hướng dẫn).
name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"    # mỗi 5 phút (mức ngắn nhất GitHub cho phép; GitHub có thể trễ vài phút)
  workflow_dispatch:         # cho phép bấm chạy thử bằng tay

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping các ứng dụng
        run: |
          # Chỉ liệt kê URL của app thật sự cần giữ thức (không phải portal tĩnh)
          URLS=(
            "https://demo.kendu-ai.com/"
            "https://carcare.kendu-ai.com/"
          )
          fail=0
          for u in "${URLS[@]}"; do
            # app đang ngủ có thể mất 30-60 giây để thức dậy, nên cho chờ tối đa 90 giây và thử lại 3 lần
            code=$(curl -s -o /dev/null -L --max-time 90 --retry 3 --retry-delay 10 \
                   -w "%{http_code}" "$u" || echo 000)
            echo "$u -> $code"
            case "$code" in 2*|3*) ;; *) fail=1 ;; esac
          done
          exit $fail
